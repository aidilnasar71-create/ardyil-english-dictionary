

name: Build ARDYIL Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p android-project
          unzip -q ARDYIL_English_Dictionary_Android_Mic_Recording_Fix.zip -d android-project
          PROJECT_DIR=$(find android-project -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply latest ARDYIL interface and learning modules
        run: |
          ASSET_HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$ASSET_HTML"
          cp index.html "$ASSET_HTML"
          echo "Applied latest ARDYIL 3.0 interface to Android assets."

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p apk-output
          APK=$(find "$PROJECT_DIR" -path "*/build/outputs/apk/debug/*.apk" -type f | head -n 1)
          test -n "$APK"
          cp "$APK" apk-output/ARDYIL-English-Dictionary-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARDYIL-English-Dictionary-APK
          path: apk-output/ARDYIL-English-Dictionary-debug.apk
