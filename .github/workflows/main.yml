
name: Buat APK Kamus Bahasa Inggris ARDYIL

on:
  push:
    branches:
      - utama
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ARDYIL Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project ZIP
        run: |
          ZIP_FILE="ARDYIL_English_Dictionary_Android_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP proyek Android tidak ditemukan."
            exit 1
          fi

          mkdir -p android-project
          unzip -q "$ZIP_FILE" -d android-project

          echo "Isi ZIP berhasil diekstrak."
          find android-project -maxdepth 4 -type f | head -100

      - name: Locate Gradle project
        id: locate
        run: |
          SETTINGS=$(find android-project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            | head -1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di dalam ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Proyek ditemukan di: $PROJECT_DIR"

      
      - name: Build APK
        run: |
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"
          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Menggunakan Gradle Wrapper."
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          elif command -v gradle >/dev/null 2>&1; then
            echo "Gradle Wrapper tidak tersedia."
            echo "Menggunakan Gradle yang terpasang."
            gradle assembleDebug
          else
            echo "ERROR: Gradle tidak tersedia."
            exit 1
          fi

          echo "Mencari hasil APK..."
          find . -type f -name "*.apk"
          

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARDYIL-English-Dictionary-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
